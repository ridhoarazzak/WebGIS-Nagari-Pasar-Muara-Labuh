<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebGIS Pasar Muara Labuh</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;height:100%;font:14px system-ui,sans-serif}
#map{position:absolute;inset:0}
#top{position:absolute;top:8px;left:8px;right:8px;background:#fffd;padding:8px 12px;border-radius:10px;font-weight:600}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:42%;overflow:auto;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -2px 12px #0004;padding:10px 14px}
.chip{border:1px solid #bbb;background:#fff;border-radius:16px;padding:5px 10px;margin:2px;font-size:13px}
.chip.on{background:#2c3e50;color:#fff}.chip:disabled{opacity:.4}
.row{display:flex;align-items:center;gap:8px;margin:5px 0}
.row i{width:16px;height:16px;border:1px solid #888;display:inline-block}
.row span{margin-left:auto;font-weight:600}
.cat{font-size:11px;color:#777;margin:8px 0 0}
.note{font-size:12px;color:#555;margin:6px 0}
.pin{width:26px;height:26px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 12px/22px system-ui;text-align:center;box-shadow:0 1px 4px #0008;cursor:pointer}
.pin.k1{background:#d7191c}.pin.k2{background:#3366ff}
.row.go{cursor:pointer}.pop a{color:#0b57d0}
</style></head><body>
<div id="map"></div>
<div id="top">WebGIS Pasar Muara Labuh</div>
<div id="sheet">
 <div id="chips"></div>
 <div id="ringkas"></div>
 <div id="note" class="note"></div>
 <div id="vid"></div>
 <label>Kepekatan <input id="op" type="range" min="0.1" max="1" step="0.05" value="0.6"></label>
 <button id="bm" class="chip">Ganti peta dasar</button>
 <p class="cat">Indikasi/estimasi dari data satelit, bukan data resmi pemerintah.</p>
</div>
<script>
const BASE='data/';
const BATAS='batas_nagari.geojson';
const LAYERS=[
 {id:'potensi',judul:'Potensi',file:'potensi_pol.geojson',warna:{1:'#00FFFF',2:'#76FF03',3:'#FF00FF'},
  note:'Hasil baca warna peta potensi; luas dihitung dari poligon.'},
 {id:'komoditas',judul:'Komoditas',file:'komoditas_pol.geojson',warna:{1:'#FFA500',2:'#8B4513',3:'#FF0000'},
  note:'Ambang warna bersifat perkiraan; luas kecil, baca sebagai indikasi awal.'},
 {id:'banjir',judul:'Banjir',file:'banjir_pol.geojson',warna:{1:'#FF0000',2:'#FFA500',3:'#FFFF00'},
  note:'Tiga tingkat risiko dari peta risiko banjir; bukan data resmi kebencanaan.'},
 {id:'rawan',judul:'Rawan genangan',file:'rawan_genangan_pol.geojson',
  warna:{1:'#2ECC71',2:'#F1C40F',3:'#E67E22',4:'#C0392B',5:'#1f78b4'},
  note:'Perkiraan dari radar Sentinel-1 (2019-2026) + HAND 90 m. Tidak membaca kedalaman banjir. Kelas "Sangat tinggi" praktis hanya alur sungai. Bobot dan kelas belum dikalibrasi. Wajib dicek lapangan.'},
 {id:'ekonomi',judul:'Ekonomi',file:'ekonomi_pol.geojson',warna:{1:'#34495e',2:'#0000FF',3:'#f1c40f'},
  note:'Cahaya malam, relatif terhadap Kab. Solok Selatan. Piksel satelit ±500 m, jadi seluruh nagari jatuh di satu zona.'},
 {id:'suhu',judul:'Suhu',file:'suhu_pol.geojson',warna:{1:'#FF0000'},
  note:'Citra siang Landsat 9 (2023-2024), ambang 30 °C. Menunjukkan area lebih panas, bukan suhu udara.'},
 {id:'bangunan',judul:'Bangunan',file:'bangunan.geojson',bangunan:true,warna:{},
  note:'Open Buildings v3, keyakinan ≥ 0,7.'},
 {id:'lulc',judul:'LULC',file:'lulc_2025_pol.geojson',video:'timelapse_lulc.mp4',
  warna:{1:'#419BDF',2:'#397D49',3:'#88B053',4:'#7A87C6',5:'#E49635',6:'#DFC35A',7:'#C4281B',8:'#A59B8F'},
  note:'Dynamic World (Sentinel-2, 10 m), tutupan lahan 2025. Hasil model otomatis, belum divalidasi lapangan. Video di bawah: perubahan tahunan.'},
 {id:'dr_zona',judul:'Drainase: Zona',file:'drainase_zona.geojson',warna:{1:'#ffd400'},
  note:'Zona prioritas drainase tinggi. Skor relatif, bobot belum dikalibrasi: indikasi, bukan bukti genangan.'},
 {id:'dr_ruas',judul:'Drainase: Ruas',file:'drainase_ruas.geojson',nilai:'panjang_m',sat:'m',
  warna:{1:'#a6d96a',2:'#fdae61',3:'#d7191c',4:'#3366ff'},
  relatif:true,
  note:'Ruas per 100 m (koridor 60 m). Tinggi/sedang/rendah dibandingkan antar ruas jalan (±sepertiga teratas = tinggi), bukan ambang mutlak. Biru = dekat sungai (±50 m): penanganan banjir sungai.'},
 {id:'dr_potong',judul:'Drainase: Titik potong',file:'drainase_potong.geojson',titik:true,
  warna:{1:'#ffffff',2:'#ff00ff'},
  note:'Titik jalan memotong alur sungai. Magenta = kandidat gorong-gorong, putih = jembatan. Perlu dicek di lapangan.'},
 {id:'dr_top',judul:'Drainase: Top 10',file:'drainase_top10.geojson',pin:true,warna:{1:'#d7191c',2:'#3366ff'},
  note:'Merah = 10 ruas drainase jalan teratas, biru = 10 ruas dekat sungai teratas. Ketuk angka untuk detail dan tautan Google Maps. Urutan relatif, perlu dicek di lapangan.'}
];
const $=id=>document.getElementById(id);
let aktif=null;
const map=new maplibregl.Map({container:'map',center:[101.07,-1.477],zoom:13,style:{version:8,sources:{
 sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,attribution:'Esri World Imagery'},
 osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap'}},
 layers:[{id:'sat',type:'raster',source:'sat'},{id:'osm',type:'raster',source:'osm',layout:{visibility:'none'}}]}});

function warnaExpr(w){const e=['match',['to-string',['get','kelas']]];Object.keys(w).forEach(k=>e.push(k,w[k]));e.push('#999999');return e}

function tingkat(d){
 const sk=d.features.filter(f=>f.properties.kelas!==4).map(f=>+f.properties.skor_mean).sort((a,b)=>a-b);
 const n=sk.length,t1=sk[Math.floor(n/3)],t2=sk[Math.floor(2*n/3)];
 const nm={1:'Rendah',2:'Sedang',3:'Tinggi',4:'Dekat sungai'};
 d.features.forEach(f=>{const p=f.properties;
  if(p.kelas!==4)p.kelas=p.skor_mean>t2?3:p.skor_mean>=t1?2:1;
  p.nama=nm[p.kelas]});
}
function buatPin(L){
 L.markers=L.data.features.map(f=>{
  const p=f.properties,el=document.createElement('div');
  el.className='pin k'+p.kelas;el.textContent=p.urut;
  const h=`<div class="pop"><b>#${p.urut} ${p.nama}</b><br>${p.jalan}<br>skor ${(+p.skor_mean).toFixed(2)} · ${Math.round(p.panjang_m)} m · ${p.jarak_sungai_m>=500?'≥500':Math.round(p.jarak_sungai_m)} m dari sungai<br><a href="${p.link}" target="_blank" rel="noopener">Buka di Google Maps</a></div>`;
  return new maplibregl.Marker({element:el}).setLngLat(f.geometry.coordinates)
   .setPopup(new maplibregl.Popup({offset:16}).setHTML(h));
 });
}
function kePin(i){
 const L=LAYERS.find(x=>x.id===aktif),m=L.markers[i];
 map.flyTo({center:m.getLngLat(),zoom:17});
 if(!m.getPopup().isOpen())m.togglePopup();
}

map.on('load',async()=>{
 try{
  const b=await (await fetch(BASE+BATAS)).json();
  map.addSource('batas',{type:'geojson',data:b});
  const bb=new maplibregl.LngLatBounds();
  const walk=c=>typeof c[0]==='number'?bb.extend(c):c.forEach(walk);
  b.features.forEach(f=>walk(f.geometry.coordinates));
  map.fitBounds(bb,{padding:40,animate:false});
 }catch(e){}
 for(const L of LAYERS){
  try{
   L.data=await (await fetch(BASE+L.file)).json();
   if(L.relatif)tingkat(L.data);
   if(L.pin){buatPin(L);continue}
   map.addSource(L.id,{type:'geojson',data:L.data});
   map.addLayer(L.titik
    ?{id:L.id,type:'circle',source:L.id,layout:{visibility:'none'},
      paint:{'circle-radius':7,'circle-color':warnaExpr(L.warna),'circle-stroke-color':'#000','circle-stroke-width':1.5,'circle-opacity':0.9}}
    :{id:L.id,type:'fill',source:L.id,layout:{visibility:'none'},
      paint:{'fill-color':L.bangunan?'#e74c3c':warnaExpr(L.warna),'fill-opacity':0.6}});
  }catch(e){L.error=true}
 }
 if(map.getSource('batas'))map.addLayer({id:'batas',type:'line',source:'batas',paint:{'line-color':'#fff','line-width':2.5}});
 LAYERS.forEach(L=>{
  const b=document.createElement('button');
  b.className='chip';b.dataset.id=L.id;b.textContent=L.judul;b.disabled=!!L.error;
  b.onclick=()=>pilih(L.id);$('chips').appendChild(b);
 });
 const p=LAYERS.find(L=>!L.error);
 if(p)pilih(p.id);else $('ringkas').textContent='Data belum termuat. Cek nama file di LAYERS.';
});

function pilih(id){
 aktif=id;
 LAYERS.forEach(L=>{
  if(L.error)return;
  if(L.pin)L.markers.forEach(m=>L.id===id?m.addTo(map):m.remove());
  else map.setLayoutProperty(L.id,'visibility',L.id===id?'visible':'none');
 });
 document.querySelectorAll('.chip[data-id]').forEach(c=>c.classList.toggle('on',c.dataset.id===id));
 const L=LAYERS.find(x=>x.id===id);
 $('note').textContent=L.note||'';
 $('vid').innerHTML=L.video?`<video src="${BASE+L.video}" controls loop muted playsinline preload="metadata" style="width:100%;border-radius:8px;background:#000"></video>`:'';
 if(L.bangunan){
  const n=L.data.features.length;
  const m2=L.data.features.reduce((s,f)=>s+(+f.properties.area_in_meters||0),0);
  $('ringkas').innerHTML=`<b>${L.judul}</b><div class="row"><i style="background:#e74c3c"></i>Bangunan terdeteksi<span>${n} unit</span></div><div class="row">Total luas atap<span>${(m2/10000).toFixed(2)} ha</span></div>`;
  return;
 }
 if(L.pin){
  const ur=L.data.features.map((f,i)=>({p:f.properties,i})).sort((a,b)=>a.p.kelas-b.p.kelas||a.p.urut-b.p.urut);
  let k=0,h='<b>'+L.judul+'</b>';
  ur.forEach(({p,i})=>{
   if(p.kelas!==k){k=p.kelas;h+=`<div class="note"><b>${p.nama}</b></div>`}
   h+=`<div class="row go" onclick="kePin(${i})"><i style="background:${L.warna[p.kelas]}"></i>${p.urut}. ${p.jalan}<span>${(+p.skor_mean).toFixed(2)}</span></div>`;
  });
  $('ringkas').innerHTML=h;return;
 }
 const nk=L.nilai||'luas_ha',sat=L.sat||'ha',sum={};
 L.data.features.forEach(f=>{const p=f.properties,k=p.kelas;
  sum[k]=sum[k]||{nama:p.nama||('Kelas '+k),v:0};sum[k].v+=L.titik?1:(+p[nk]||0)});
 const fmt=v=>L.titik?v+' titik':(sat==='m'?Math.round(v)+' m':v.toFixed(1)+' '+sat);
 $('ringkas').innerHTML='<b>'+L.judul+'</b>'+Object.keys(sum).map(k=>
  `<div class="row"><i style="background:${L.warna[k]||'#999'}"></i>${sum[k].nama}<span>${fmt(sum[k].v)}</span></div>`).join('');
}

map.on('click',e=>{
 if(!aktif||LAYERS.find(x=>x.id===aktif).pin)return;
 const f=map.queryRenderedFeatures(e.point,{layers:[aktif]})[0];
 if(!f)return;
 const p=f.properties;
 const h=p.area_in_meters!==undefined
  ?`<b>Bangunan</b><br>${(+p.area_in_meters).toFixed(0)} m²<br>keyakinan ${(+p.confidence).toFixed(2)}`
  :`<b>${p.zona||p.nama}</b>`+(p.jalan?`<br>${p.jalan}`:'')
   +(p.skor_mean!==undefined?`<br>skor ${(+p.skor_mean).toFixed(2)}`:'')
   +(p.panjang_m!==undefined?`<br>${Math.round(p.panjang_m)} m`:'')
   +(p.luas_ha!==undefined?`<br>${(+p.luas_ha).toFixed(2)} ha`:'');
 new maplibregl.Popup().setLngLat(e.lngLat).setHTML(h).addTo(map);
});
$('op').oninput=e=>LAYERS.forEach(L=>!L.error&&!L.pin&&map.setPaintProperty(L.id,L.titik?'circle-opacity':'fill-opacity',+e.target.value));
$('bm').onclick=()=>{
 const s=map.getLayoutProperty('sat','visibility')!=='none';
 map.setLayoutProperty('sat','visibility',s?'none':'visible');
 map.setLayoutProperty('osm','visibility',s?'visible':'none');
};
</script></body></html>
